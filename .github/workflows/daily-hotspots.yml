name: daily-hotspots
on: [workflow_dispatch, schedule]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-hotspots
  cancel-in-progress: false
jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests markdown
      - run: python3 scripts/fetch_hotspots.py
      - name: Analyze hotspots with LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python3 scripts/analyze_hotspots.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotspots/
          if git diff --cached --quiet; then
            echo "no new data, skip commit"
          else
            git commit -m "daily hotspots $(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi
      - run: python3 scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - run: ls -la _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
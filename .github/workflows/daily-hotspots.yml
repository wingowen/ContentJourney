name: 每日热点获取

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-hotspots
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests markdown

      - run: python3 scripts/fetch_hotspots.py

      - name: Analyze hotspots with LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python3 scripts/analyze_hotspots.py

      - name: Convert index.md to index.html
        run: |
          python3 -c "
import markdown as md
with open('hotspots/index.md') as f:
    html = md.markdown(f.read(), extensions=['tables', 'fenced_code'])
with open('hotspots/index.html', 'w') as f:
    f.write('<html lang=zh-CN><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>ContentJourney 每日热点分析</title><link rel=stylesheet href=https://cdn.jsdelivr.net/npm/water.css@2/out/water.css><body>')
    f.write(html)
    f.write('</body></html>')
print('OK')
"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotspots/
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "daily hotspots $(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - run: |
          mkdir -p _site
          cp -r hotspots/* _site/
          ls -la _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4